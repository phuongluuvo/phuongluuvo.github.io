<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 430" width="350" height="430" role="img" aria-label="Placeholder for a portrait photograph">
  <!--
    PORTRAIT PLACEHOLDER: www/images/portrait.svg

    This file is a stand-in, not a photograph: it shows initials on a wash that
    matches the site palette. Replace it with a real portrait:

      1. Save your photograph as www/images/portrait.jpg (about 350 x 430
         pixels, roughly 4:5, works well).
      2. Point the home page at it: in www/index.jemdoc change
           images/portrait.svg
         to
           images/portrait.jpg
      3. Run: python build.py
      4. Delete this file once nothing uses it.

    Palette: #F6F6F6 wash, #DDDDDD shape, #527BBD initials.

    Note for whoever edits this file: an XML comment may not contain a double
    hyphen, so keep them out of this block or the whole image stops parsing.
  -->
  <rect width="350" height="430" fill="#F6F6F6"/>
  <circle cx="175" cy="172" r="62" fill="#DDDDDD"/>
  <path d="M40 430c0-76 60-128 135-128s135 52 135 128z" fill="#DDDDDD"/>
  <text x="175" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="52" fill="#527BBD">PV</text>
  <text x="175" y="408" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#666666">Placeholder for a photo</text>
</svg>
