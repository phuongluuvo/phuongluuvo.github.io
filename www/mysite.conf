# ---------------------------------------------------------------------------
# jemdoc configuration file for the personal website of Assoc. Prof. Phuong Luu Vo
#
#  * Each [section] below replaces the built-in jemdoc default.
#  * A section ends at the first BLANK line, so do not leave blank lines
#    inside a section.
#  * Lines that start with "#" are comments and are ignored by jemdoc.
#
# You normally do NOT need to edit this file. See guide.md ("Changing the
# look and feel") if you want to change colours, fonts, or the MathJax setup.
# ---------------------------------------------------------------------------

[firstbit]
<!DOCTYPE html>
<html lang="en">
<head>
<!-- ======================================================================
     GENERATED FILE. DO NOT EDIT THIS FILE.
     It was built by build.py from the jemdoc sources in www/.
     Edit the matching www/*.jemdoc file instead, then run:
         python build.py
     See guide.md for the full instructions.
     ====================================================================== -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23527BBD'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='30' fill='%23FFFFFF' text-anchor='middle'%3EPV%3C/text%3E%3C/svg%3E" />
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  },
  chtml: { scale: 1.05 }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<!-- =======================================================================
     VISITOR COUNTING (GoatCounter, https://www.goatcounter.com)
     Free for a site like this, stores no personal data and sets no cookies, so
     no consent banner is needed.
     TO SWITCH IT ON:
       1. Make an account and note the SITE CODE, the part before
          ".goatcounter.com" in your address, e.g. "phuongluuvo".
       2. Replace YOURCODE below AND in the [lastupdated] section further down.
          Both have to agree; those are the only two places.
       3. In GoatCounter: Settings, turn ON "Allow adding visitor counts on your
          website". It is off by default, and without it the footer count stays
          empty even though the visits are still recorded.
     Until step 2 is done the script fails to load. Nothing breaks: the pages
     work, and no count is shown.
     TWO TRAPS, both of which bit while this was written: a jemdoc section ends
     at the first BLANK line, so one stray blank line here silently drops
     everything after it; and an HTML comment may not contain a double hyphen,
     which makes the page invalid. Keep this comment blank-free, single-hyphen.
     ======================================================================= -->
<script data-goatcounter="https://YOURCODE.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<!-- ========================================================================
     BODY FONT, from Google Fonts: Literata.
     Georgia, jemdoc's own font, carries no Vietnamese glyphs, so a Vietnamese
     word came out in two different typefaces on one line. Literata covers Latin
     and Vietnamese, and sits close to Georgia.
     Google's css2 endpoint returns one font file per script and the browser
     downloads only the subsets a page needs, so an English page never fetches
     the Vietnamese file.
     The stack in www/css/site.css keeps Georgia and Times New Roman BEHIND
     Literata, so if this link is blocked or offline the site still works;
     Vietnamese then falls back to Times New Roman, which does have it.
     To change the font, the family name here and the font-body and font-head
     tokens in www/css/site.css have to be changed together.
     The address below writes the ampersand as an HTML entity, which is required
     and must be kept.
     Keep this section free of blank lines: a blank line ends it and silently
     drops everything after it.
     ======================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,700;1,400&amp;display=swap" />

[defaultcss]
<link rel="stylesheet" href="css/site.css" type="text/css" />

# The page heading doubles as a link back to the home page, so that every page
# can be reached from every other page. If you prefer a plain, unlinked
# heading, delete the <a ...> and </a> parts of the line below.
[doctitle]
<div id="toptitle">
<h1><a href="index.html">|</a></h1>

[windowtitle]
<title>| &middot; Phuong Luu Vo</title>

[lastupdated]
<p>Last updated: |<span id="visitor-count"></span></p>
<script>
// The visitor count in the footer, from the same GoatCounter account as the
// script in [firstbit] -- replace YOURCODE in both places. TOTAL is
// GoatCounter's name for the whole-site figure, as opposed to one page.
//
// If it cannot be fetched -- an adblocker, no network, counting switched off --
// the span stays empty and the footer reads "Last updated: ..." as before. It
// is deliberately silent: a visitor should never see an error because of this.
// The separator is written here rather than in the HTML, so that a footer with
// no count does not end in a dangling middle dot.
//
// GoatCounter answers 404 for a total it has no data for, which is exactly what
// a brand-new account looks like. That is reported as "0 visits" rather than
// nothing, so the counter can be seen working before the first visitor arrives.
// Any other failure -- an adblocker, no network, counting switched off -- stays
// silent: the footer simply shows the date.
//
// The number is cached for up to four hours, so it refreshes on its own but not
// instantly.
document.addEventListener('DOMContentLoaded', function () {
  var span = document.getElementById('visitor-count');
  if (!span) { return; }
  var request = new XMLHttpRequest();
  request.addEventListener('load', function () {
    if (request.status === 404) {
      span.textContent = ' \u00b7 0 visits';
      return;
    }
    try {
      span.textContent = ' \u00b7 ' + JSON.parse(request.responseText).count + ' visits';
    } catch (error) { /* leave the footer exactly as it was */ }
  });
  request.open('GET', 'https://YOURCODE.goatcounter.com/counter/TOTAL.json');
  request.send();
});
</script>

# ---------------------------------------------------------------------------
# Where the lecture notes, slides and other course files live.
#
# They are NOT in this repository: they are large and they change often, so each
# course keeps them in a GitHub repository of its own. One line per course here,
#
#     NAME   address
#
# and a page writes %%NAME%% where that address belongs, for example
#
#     <li><a href="%%IT545%%/lec1.pdf" target="blank">Lecture 1 (PDF)</a></li>
#
# So moving a course's files, or renaming its repository, is ONE line here and no
# page changes at all.
#
#   * One line each. No slash at the end.
#   * The repository must be PUBLIC, or visitors cannot open the files.
#   * The branch is part of the address.
#   * A file kept in a subfolder goes in the link: %%NAME%%/slides/lec1.pdf
#   * raw.githubusercontent.com opens or downloads the file straight away. For
#     GitHub's preview page instead -- nicer for a PDF -- use
#     github.com/USER/REPO/blob/BRANCH.
#   * If a page writes %%NAME%% that is not listed below, the build stops and says
#     so, rather than leaving a link that goes nowhere.
# ---------------------------------------------------------------------------
[materials]
# One line per place the course files live; the name is what a page writes
# between %%..%%. IT545 keeps its English and Vietnamese slides in one
# repository on two branches, so each language is one line here. If your
# Vietnamese slides are somewhere else, change the second line. If they are on
# the same branch as the English ones, delete it and write %%IT545%% in both
# columns of the page instead.
it545     https://raw.githubusercontent.com/phuongluuvo/algorithm-optimization/toiuuvagiaithuat-canban
it545-vi  https://raw.githubusercontent.com/phuongluuvo/algorithm-optimization/main
