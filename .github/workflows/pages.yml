name: Build and deploy the website

# This workflow rebuilds every .html page from the .jemdoc sources in www/
# and publishes the result to GitHub Pages. It runs on every push to main, and
# can also be started by hand from the "Actions" tab.
#
# The `test` job is a second, NON-BLOCKING safety net: it rebuilds the site
# from scratch and runs tests/test_site.py so that a broken link or a missing
# page shows up in the run summary. To make it block deployment, add
#     needs: [build, test]
# to the `deploy` job below.
#
# One-time setup:  Settings -> Pages -> Build and deployment -> Source:
#                  "GitHub Actions"
# See guide.md for the step-by-step instructions and for the alternative
# (branch-based) deployment method.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; newer pushes cancel older builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # A second, non-blocking safety net: rebuild the site from scratch on a
  # clean machine and run tests/test_site.py. A broken link, a missing page or
  # a menu entry that points at a renamed file shows up here. It does not stop
  # the deployment (see the header of this file).
  # ---------------------------------------------------------------------------
  test:
    name: Rebuild and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the test dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Rebuild the site and run the test-suite
        run: python build.py --out _site && python -m pytest

  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh the generated pages from ORCID
        # Best effort. The generated www/publications.jemdoc and www/news.jemdoc
        # are committed, so if ORCID or Crossref is unreachable -- or answers
        # only partially -- the committed copies are used and the deployment
        # still goes ahead.
        run: python tools/update_site.py || echo "::warning::Could not refresh the generated pages; using the committed copies."

      - name: Generate the HTML from the .jemdoc sources
        run: python build.py --out _site

      - name: Show what was built
        run: ls -la _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
